<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: env(safe-area-inset-*) di tab bar bekerja di iPhone. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- PWA: dipasang dari Chrome/Safari tanpa service worker, jadi angka selalu dari server. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="cashtrack" />
		<!-- Warna status bar = --color-canvas; ikut tema aktif (lihat script di bawah dan ThemeToggle). -->
		<meta name="theme-color" content="#f6f6f7" />
		<!-- Cegah flash: terapkan tema sebelum render -->
		<script>
			(function () {
				var t = localStorage.getItem('ct-theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c0c0e');
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
